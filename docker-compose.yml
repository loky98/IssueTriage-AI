services:
  db:
    image: pgvector/pgvector:pg16
    container_name: issuetriage-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: issuetriage-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    build: { context: ., target: mcp }
    image: issuetriage-mcp
    container_name: issuetriage-mcp
    environment:  # solo lo imprescindible: sin .env, el código de run_snippet no tiene secretos que leer
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MCP_TRANSPORT: streamable-http
    # aislamiento para run_snippet: sistema de archivos de solo lectura, sin privilegios, con límites
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 100
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    image: issuetriage-api
    container_name: issuetriage-api
    env_file: .env
    environment:  # sobrescriben los valores de .env pensados para correr en local
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MCP_URL: http://mcp:8001/mcp
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: